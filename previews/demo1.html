<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Demo 1 · 经典豪华大转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;color:#f7ecd7;overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 50% -10%, #7a4a08 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #6b0f0f 0%, transparent 55%),
    radial-gradient(800px 500px at -10% 100%, #1e3a5f 0%, transparent 55%),
    linear-gradient(160deg,#3a2408 0%,#1c1205 60%,#0e0a04 100%);
}
.top{
  text-align:center;padding:26px 16px 6px;position:relative;
}
.top .ribbon{
  font-size:12px;letter-spacing:6px;color:#e8c979;background:rgba(232,201,121,.12);
  display:inline-block;padding:5px 16px;border-radius:30px;border:1px solid rgba(232,201,121,.3);
}
.top h1{
  font-size:34px;font-weight:900;margin-top:10px;letter-spacing:3px;
  background:linear-gradient(180deg,#fff3c4,#f5b942 60%,#d98a0b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
}
.top .sub{font-size:13px;color:#cdb886;margin-top:8px;}
.wrap{display:flex;flex-direction:column;align-items:center;padding:14px 16px 30px;}
.wheel-wrap{position:relative;width:min(90vw,400px);height:min(90vw,400px);margin-top:6px;}
.pointer{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:6;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
.pointer svg{width:56px;height:56px;}
#wheel{position:absolute;inset:0;border-radius:50%;}
.center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;
  width:112px;height:112px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 30% 30%,#fff6d8,#f5c34a 60%,#c98a12);
  border:5px solid #fff0bd;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 2px 8px rgba(255,255,255,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#5a3300;font-weight:900;transition:transform .15s;
}
.center:active{transform:translate(-50%,-50%) scale(.88);}
.center .t{font-size:13px;letter-spacing:3px;}
.center .g{font-size:34px;margin-top:2px;}
.hint{font-size:14px;color:#d8c28c;margin-top:14px;}
.hint b{color:#ffd700;font-size:18px;}
.btn-row{display:flex;gap:12px;width:100%;max-width:420px;margin-top:16px;}
.draw-btn,.fwd-btn{
  flex:1;padding:16px;border:none;border-radius:16px;font-size:17px;font-weight:800;cursor:pointer;color:#3a2400;
  background:linear-gradient(135deg,#ffd54a,#f59e0b);box-shadow:0 8px 22px rgba(245,158,11,.4);
}
.draw-btn:active,.fwd-btn:active{transform:scale(.96);}
.fwd-btn{background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff;box-shadow:0 8px 22px rgba(3,105,161,.4);}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;margin-top:16px;}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(232,201,121,.25);border-radius:16px;padding:14px 16px;text-align:center;backdrop-filter:blur(4px);}
.card .k{font-size:12px;color:#cdb886;}
.card .v{font-size:26px;font-weight:900;color:#ffd700;margin-top:4px;}
/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.overlay.show{display:flex;}
.modal{width:min(88vw,340px);border-radius:22px;text-align:center;padding:26px 22px;position:relative;transform:scale(.5);opacity:0;transition:.35s cubic-bezier(.2,.9,.3,1.4);background:linear-gradient(160deg,#2f210a,#150e05);border:2px solid rgba(255,215,74,.5);color:#f7ecd7;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.overlay.show .modal{transform:scale(1);opacity:1;}
.modal .pi{width:120px;height:120px;margin:0 auto 12px;}
.modal .pi img{width:100%;height:100%;object-fit:contain;}
.modal .m-title{font-size:22px;font-weight:900;color:#ffd700;}
.modal .m-sub{font-size:14px;color:#cdb886;margin-top:8px;line-height:1.6;}
.modal .ok{width:100%;margin-top:22px;padding:14px;border:none;border-radius:14px;color:#3a2400;font-size:16px;font-weight:800;background:linear-gradient(135deg,#ffd54a,#f59e0b);cursor:pointer;}
.burst{position:absolute;width:7px;height:7px;border-radius:50%;opacity:0;pointer-events:none;}
.burst.go{animation:burst .9s ease-out forwards;}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}}
.confetti{position:absolute;top:-20px;left:50%;width:12px;height:12px;opacity:0;pointer-events:none;border-radius:2px;}
.confetti.go{animation:cf .95s ease-in forwards;}
@keyframes cf{0%{transform:translate(-50%,0) rotate(0);opacity:1;}100%{transform:translate(var(--fx),var(--fy)) rotate(720deg);opacity:0;}}
.toast{position:fixed;top:40px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:99;padding:11px 22px;border-radius:30px;background:rgba(0,0,0,.85);color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:.3s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <div class="top">
    <span class="ribbon">LUCKY · WHEEL</span>
    <h1>幸运大转盘</h1>
    <div class="sub">🎁 vivo X200s 等你抽回家</div>
  </div>

  <div class="wrap">
    <div class="wheel-wrap" id="wheel-wrap">
      <div class="pointer"><svg viewBox="0 0 56 56"><path d="M28 4 L44 42 A30 30 0 0 1 12 42 Z" fill="#ffd700" stroke="#b45309" stroke-width="3"/><circle cx="28" cy="36" r="4" fill="#b45309"/></svg></div>
      <canvas id="wheel"></canvas>
      <div class="center" id="centerBtn"><span class="t">开始抽奖</span><span class="g">🎁</span></div>
    </div>
    <div class="hint">剩余 <b id="remain">3</b> 次 · 转发可再获次数</div>

    <div class="btn-row">
      <button class="draw-btn" id="drawBtn">🎯 开始抽奖</button>
      <button class="fwd-btn" id="fwdBtn">📤 分享+1次</button>
    </div>

    <div class="cards">
      <div class="card"><div class="k">剩余次数</div><div class="v" id="cardTimes">3</div></div>
      <div class="card"><div class="k">今日转发</div><div class="v" id="cardFwd">0</div></div>
    </div>
  </div>

  <div class="overlay" id="loseOverlay"><div class="modal">
    <div class="pi"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='54' r='28' fill='%23f59e0b'/><circle cx='41' cy='49' r='3.5' fill='%237c2d12'/><circle cx='59' cy='49' r='3.5' fill='%237c2d12'/><path d='M38 60 q12 12 24 0' stroke='%237c2d12' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg>"></div>
    <div class="m-title">很遗憾，未中奖</div>
    <div class="m-sub">感谢参与，分享给好友再获抽奖机会</div>
    <button class="ok" data-close="loseOverlay">再接再厉</button>
  </div></div>

  <div class="overlay" id="couponOverlay"><div class="modal">
    <div class="pi" id="couponImg"></div>
    <div class="m-title">🎉 恭喜中奖</div>
    <div class="m-sub" id="couponSub"></div>
    <button class="ok" data-close="couponOverlay">开心收下</button>
  </div></div>

  <div class="overlay" id="phoneOverlay"><div class="modal" id="phoneModal">
    <div class="pi"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23a5f3fc'/><stop offset='1' stop-color='%230284c7'/></linearGradient></defs><rect x='29' y='6' width='42' height='88' rx='11' fill='%23111'/><rect x='33' y='11' width='34' height='74' rx='6' fill='url(%23s)'/></svg>"></div>
    <div class="m-title" style="color:#ffd700;">🎉 恭喜抽中手机 🎉</div>
    <div class="m-sub">vivo X200s 黑（12G+256G）</div>
    <button class="ok" id="toAddr">填写收货地址</button>
  </div></div>

  <div id="toast" class="toast"></div>

<script src="demo-core.js"></script>
<script>
var SLOTS=[
 {name:'vivo X200s',img:'phone',  c1:'#fde047',c2:'#b45309'},
 {name:'感谢参与',  img:'thanks', c1:'#fca5a5',c2:'#dc2626'},
 {name:'感谢参与',  img:'thanks', c1:'#c4b5fd',c2:'#7c3aed'},
 {name:'5元话费券', img:'coupon5',c1:'#7dd3fc',c2:'#0284c7'},
 {name:'感谢参与',  img:'thanks', c1:'#fda4af',c2:'#db2777'},
 {name:'感谢参与',  img:'thanks', c1:'#86efac',c2:'#16a34a'},
 {name:'10元话费券',img:'coupon10',c1:'#a5b4fc',c2:'#4f46e5'},
 {name:'感谢参与',  img:'thanks', c1:'#fcd34d',c2:'#d97706'}
];
var spinning=false;
var wheel=Demo.build('wheel', SLOTS, {
  textColor:'#fff', centerColor:'#fff6d8', ringColor:'#ffd700'
});
function pick(){ return Math.floor(Math.random()*SLOTS.length); }
function doDraw(){
  if(spinning) return;
  spinning=true;
  var idx=pick();
  wheel.spin(idx);
  setTimeout(function(){
    show(idx); spinning=false;
  },4300);
}
function show(idx){
  if(idx===0){ showOverlay('phoneOverlay'); burstFx(document.getElementById('phoneModal')); }
  else if(idx===3){ coupon('5元话费券','coupon5'); }
  else if(idx===6){ coupon('10元话费券','coupon10'); }
  else showOverlay('loseOverlay');
}
function coupon(name,img){ $('#couponImg').innerHTML='<img src="'+Demo.IMG[img]+'">'; $('#couponSub').textContent='获得 '+name; showOverlay('couponOverlay'); }
function $(id){return document.getElementById(id);}
function showOverlay(id){$(id).classList.add('show');}
function hideOverlay(id){$(id).classList.remove('show');}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},2200);}
function burstFx(el){
  var cs=['#ffd700','#ffaa00','#fff3b0','#ff6b6b','#38bdf8','#34d399','#f472b6'];
  for(var i=0;i<36;i++){var b=document.createElement('div');b.className='burst';b.style.background=cs[i%cs.length];
    b.style.left=(50+Math.random()*40-20)+'%';b.style.top=(50+Math.random()*40-20)+'%';
    b.style.setProperty('--dx',(Math.random()*240-120)+'px');b.style.setProperty('--dy',(Math.random()*240-120)+'px');
    el.appendChild(b);(function(x){requestAnimationFrame(function(){x.classList.add('go');});})(b);setTimeout(function(){b.remove();},1000);}
  for(var j=0;j<14;j++){var c=document.createElement('div');c.className='confetti';c.style.background=cs[j%cs.length];
    c.style.setProperty('--fx',(Math.random()*280-140)+'px');c.style.setProperty('--fy',(240+Math.random()*180)+'px');
    el.appendChild(c);(function(x){requestAnimationFrame(function(){x.classList.add('go');});})(c);setTimeout(function(){c.remove();},1100);}
}
$('centerBtn').addEventListener('click',doDraw);
$('drawBtn').addEventListener('click',doDraw);
$('fwdBtn').addEventListener('click',function(){toast('📤 请分享给好友，稍候次数+1');});
document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',function(){hideOverlay(b.getAttribute('data-close'));});});
$('toAddr').addEventListener('click',function(){hideOverlay('phoneOverlay');toast('📦 收货地址功能见正式版');});
</script>
</body>
</html>
